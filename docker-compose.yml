# CVAT 骨格推定モデル デプロイファイル生成アプリ (T-12)
# 3 サービス構成 (§11): web / worker / redis。
# web と worker は同一イメージ・同一 storage volume を共有する (§11.4)。
# 起動: docker compose up --build   ->   http://<server-ip>:8000 (§3 / §11.5)

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      # LAN 内の別 PC から IP でアクセス (§3.1 / AC-14)。
      # 既定はホスト 8000。8000 が他プロセスと競合する場合は WEB_PORT=8080 等で上書き可能。
      - "${WEB_PORT:-8000}:8000"
    environment:
      - REDIS_HOST=redis
      - STORAGE_DIR=/storage
    volumes:
      - storage:/storage
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    # 重い処理 (ONNX変換/生成/zip) を担当。キュー名は settings.rq_queue_name と一致 (§16.4)。
    command: rq worker jobs --url redis://redis:6379/0
    environment:
      - REDIS_HOST=redis
      - STORAGE_DIR=/storage
    volumes:
      - storage:/storage
    depends_on:
      - redis
    restart: unless-stopped

  cleanup:
    build: .
    # 期限切れの一時ファイル/ジョブを定期削除する (§17.1)。
    command: python -m app.services.cleanup
    environment:
      - REDIS_HOST=redis
      - STORAGE_DIR=/storage
    volumes:
      - storage:/storage
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  storage:
