# CVAT 骨格推定モデル デプロイファイル生成アプリ (T-12 / req_add02)
# 4 サービス構成 (§11): web / worker / redis / cleanup。
# web と worker は同一イメージ・同一 storage volume を共有する (§11.4)。
# 起動: docker compose up --build   ->   http://<server-ip>:8050 (§3 / §11.5)
# <server-ip> はアプリを動かす実機の IP。ハードコードせず 0.0.0.0 で待受するため、
# クローンした PC の IP でそのままアクセスできる（IP 設定は不要）。
#
# req_add02 (WSL 構成): CVAT の serverless 配下へ生成フォルダを保存するため、ホスト側
# CVAT ルート (CVAT_BASE_PATH) を web / worker に host==container の同一パスで bind mount
# する (§5.2)。compose は WSL(Ubuntu) シェルから実行すること (Docker Desktop WSL 統合)。
# CVAT_BASE_PATH が未設定 (空) の場合は CVAT 保存 + 自動デプロイをスキップし zip のみ
# 生成するため、bind mount にはプレースホルダの既定値を用いて compose が壊れないようにする。
#
# deploy script (deploy_{cpu,gpu}.sh) は docker/nuctl を必要とするため、worker コンテナ
# 内では実行しない。worker は生成〜mymodel 保存までを行い deploy を "deploy" キューへ
# 委譲する。deploy キューは WSL ホスト上の deploy ワーカー (rq worker deploy) が処理する。
# そのためホストからも Redis に接続できるよう redis のポートを公開する。

services:
  redis:
    image: redis:7-alpine
    ports:
      # WSL ホスト上の deploy ワーカー (rq worker deploy) が接続するため公開。
      - "6379:6379"
    restart: unless-stopped

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      # LAN 内の別 PC から IP でアクセス (§3.1 / AC-14)。
      # 既定はホスト 8050。8050 が他プロセスと競合する場合は .env の WEB_PORT=8080 等で上書き可能。
      - "${WEB_PORT:-8050}:8000"
    environment:
      - REDIS_HOST=redis
      - STORAGE_DIR=/storage
      # 事前チェック (serverless / deploy script の存在確認 §13) のため web にも渡す。
      - CVAT_BASE_PATH=${CVAT_BASE_PATH:-}
      - DEPLOY_TIMEOUT_SECONDS=${DEPLOY_TIMEOUT_SECONDS:-600}
    volumes:
      - storage:/storage
      # ホスト側 CVAT リポジトリを同一パスで参照 (§5.2)。未設定時はプレースホルダ。
      - ${CVAT_BASE_PATH:-/tmp/cvat_placeholder}:${CVAT_BASE_PATH:-/tmp/cvat_placeholder}
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    # 重い処理 (ONNX変換/生成/zip) と CVAT の mymodel 配下への保存を担当 (§8.4)。
    # deploy script 自体は実行しない (docker/nuctl が無いため)。保存後は "deploy" キューへ
    # 委譲し、WSL ホスト上の deploy ワーカーが sh を実行する。
    # キュー名は settings.rq_queue_name と一致 (§16.4)。
    command: rq worker jobs --url redis://redis:6379/0
    environment:
      - REDIS_HOST=redis
      - STORAGE_DIR=/storage
      - CVAT_BASE_PATH=${CVAT_BASE_PATH:-}
      - DEPLOY_TIMEOUT_SECONDS=${DEPLOY_TIMEOUT_SECONDS:-600}
    volumes:
      - storage:/storage
      # ホスト側 CVAT リポジトリ (mymodel への書き込み先)。未設定時はプレースホルダ。
      - ${CVAT_BASE_PATH:-/tmp/cvat_placeholder}:${CVAT_BASE_PATH:-/tmp/cvat_placeholder}
    depends_on:
      - redis
    restart: unless-stopped

  cleanup:
    build: .
    # 期限切れの一時ファイル/ジョブを定期削除する (§17.1)。
    command: python -m app.services.cleanup
    environment:
      - REDIS_HOST=redis
      - STORAGE_DIR=/storage
    volumes:
      - storage:/storage
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  storage:
